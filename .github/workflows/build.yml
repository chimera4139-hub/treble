name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make icons and Info.plist
        run: python3 prepare.py
      - name: Install Theos
        run: |
          brew install ldid dpkg
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/theos/sdks
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          ls $HOME/theos/sdks
      - name: Build
        run: |
          OK=0
          for SDK in $(ls $THEOS/sdks | sed -n 's/^iPhoneOS\([0-9.]*\)\.sdk$/\1/p' | sort -V); do
            echo "=== Trying SDK $SDK ==="
            rm -rf .theos packages
            if make package FINALPACKAGE=1 TARGET=iphone:clang:$SDK:6.0 2>&1 | grep -v "ld: warning"; [ "${PIPESTATUS[0]}" = "0" ]; then
              echo "=== SDK $SDK WORKED ==="
              OK=1
              break
            fi
          done
          [ "$OK" = "1" ]
      - uses: actions/upload-artifact@v4
        with:
          name: Treble-deb
          path: packages/*.deb
